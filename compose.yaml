services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rolling
      POSTGRES_USER: rolling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - price_history:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolling -d rolling"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rolling:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/rolling
      JCAP_DATA_URL: ${JCAP_DATA_URL:-https://jcapallinone.ngrok.app}
      JCAP_SERVICE_KEY: ${JCAP_SERVICE_KEY:?Set JCAP_SERVICE_KEY in .env}
      APP_USERNAME: ${APP_USERNAME:-matthew}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:8798:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  price_history:
